<title>Dashboard kênh social</title>
<style>
/* Màu: bảng màu dataviz tham chiếu, đã chọn riêng cho chế độ sáng và tối. */
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --wash: rgba(11, 11, 11, 0.045);
  --series-1: #2a78d6;
  --track: #cde2fb;
  --good: #0ca30c;
  --warning: #fab219;
  --critical: #d03b3b;
  --font: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255, 255, 255, 0.10);
    --wash: rgba(255, 255, 255, 0.06);
    --series-1: #3987e5;
    --track: #184f95;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d;
  --surface: #1a1a19;
  --ink: #ffffff;
  --ink-2: #c3c2b7;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255, 255, 255, 0.10);
  --wash: rgba(255, 255, 255, 0.06);
  --series-1: #3987e5;
  --track: #184f95;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font: 14px/1.45 var(--font);
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; }

/* ---------- header ---------- */
.top { background: var(--surface); border-bottom: 1px solid var(--border); }
.top-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 12px; padding-bottom: 12px; flex-wrap: wrap; }
.brand h1 { font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
.sub { color: var(--ink-2); font-size: 12.5px; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.updated { color: var(--muted); font-size: 12.5px; }
.btn {
  border: 1px solid var(--border); background: var(--surface); border-radius: 8px;
  padding: 6px 12px; cursor: pointer; min-height: 32px;
}
.btn:hover { background: var(--wash); }
.btn-icon { width: 32px; padding: 0; display: inline-grid; place-items: center; }
.btn[disabled] { opacity: .55; cursor: progress; }

/* ---------- filter row ---------- */
.filters { display: flex; align-items: center; gap: 12px; padding: 16px 0 12px; flex-wrap: wrap; }
.filters-label { color: var(--ink-2); font-size: 12.5px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 2px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 12px; border-radius: 6px; cursor: pointer; color: var(--ink-2); }
.seg button:hover { background: var(--wash); }
.seg button[aria-pressed="true"] { background: var(--wash); color: var(--ink); font-weight: 650; }
.seg button[aria-pressed="true"]::before { content: "✓ "; font-weight: 700; }

#banner:empty { display: none; }
.banner { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 10px 14px; margin-bottom: 12px; display: flex; gap: 10px; align-items: center; }
#content { transition: opacity .15s; }
#content.is-loading { opacity: .55; pointer-events: none; }
#content > * + * { margin-top: 16px; }

/* ---------- card ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.card-title { font-size: 14px; font-weight: 650; }
.card-sub { color: var(--ink-2); font-size: 12.5px; margin-top: 1px; }
.view-toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; padding: 2px; gap: 2px; }
.view-toggle button { border: 0; background: transparent; padding: 2px 9px; font-size: 12px; border-radius: 5px; cursor: pointer; color: var(--ink-2); }
.view-toggle button[aria-pressed="true"] { background: var(--wash); color: var(--ink); font-weight: 650; }

/* ---------- KPI ---------- */
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.kpis .hero { grid-column: span 2; }
.tile-label { color: var(--ink-2); font-size: 12.5px; }
.tile-value { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15; margin-top: 4px; }
.hero .tile-value { font-size: clamp(40px, 5vw, 56px); line-height: 1.05; letter-spacing: -0.03em; }
.tile-note { color: var(--ink-2); font-size: 12.5px; margin-top: 6px; display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.tile-note .dim { color: var(--muted); }
.tile .spark { margin-top: 8px; display: block; }
.delta { display: inline-flex; align-items: center; gap: 3px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.delta svg { flex: none; }

/* ---------- alerts ---------- */
.alerts { border-color: color-mix(in srgb, var(--critical) 35%, var(--border)); }
.alert-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
.alert-list button { width: 100%; text-align: left; display: flex; gap: 8px; align-items: flex-start; border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
.alert-list button:hover { background: var(--wash); }
.alert-list .who { font-weight: 600; }
.alert-list .why { color: var(--ink-2); font-size: 12.5px; }

/* ---------- charts ---------- */
.grid-2 { display: grid; gap: 16px; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.grid-2.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.chart { position: relative; width: 100%; min-height: 220px; }
.chart svg { display: block; overflow: visible; touch-action: pan-y; }
.chart svg:focus-visible { outline-offset: 4px; border-radius: 4px; }
.ax-grid { stroke: var(--grid); stroke-width: 1; }
.ax-base { stroke: var(--axis); stroke-width: 1; }
.ax-text { fill: var(--muted); font-size: 11px; font-family: var(--font); font-variant-numeric: tabular-nums; }
.end-label { fill: var(--ink); font-size: 12px; font-weight: 650; font-family: var(--font); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; }
.line { fill: none; stroke: var(--series-1); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.area { fill: var(--series-1); opacity: .10; }
.dot { fill: var(--series-1); stroke: var(--surface); stroke-width: 2; }
.bar { fill: var(--series-1); }
.bar.on { filter: brightness(1.15); }
.cross { stroke: var(--axis); stroke-width: 1; }
.spark path { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark circle { fill: var(--series-1); stroke: var(--surface); stroke-width: 2; }

.hbars { display: grid; gap: 10px; }
.hb { display: grid; grid-template-columns: minmax(70px, 150px) minmax(0, 1fr); gap: 10px; align-items: center; cursor: default; border: 0; background: transparent; padding: 0; text-align: left; width: 100%; }
button.hb { cursor: pointer; }
.hb-label { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hb-label small { display: block; color: var(--muted); font-size: 11.5px; }
.hb-track { display: flex; align-items: center; gap: 8px; min-width: 0; }
.hb-bar { height: 14px; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 2px; transition: filter .1s; }
.hb:hover .hb-bar, .hb:focus-visible .hb-bar { filter: brightness(1.15); }
.hb-val { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- tooltip ---------- */
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; box-shadow: 0 6px 24px rgba(0, 0, 0, .14); min-width: 150px; max-width: 280px; font-size: 12.5px; }
.tip[hidden] { display: none; }
.tip-title { color: var(--ink-2); margin-bottom: 4px; }
.tip-row { display: flex; align-items: baseline; gap: 6px; }
.tip-row strong { font-size: 13.5px; font-variant-numeric: tabular-nums; }
.tip-row span { color: var(--ink-2); }
.tip-key { display: inline-block; width: 12px; height: 2px; background: var(--series-1); align-self: center; border-radius: 1px; }
.tip-row.minor strong { font-size: 12.5px; font-weight: 600; }

/* ---------- table ---------- */
.toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.toolbar .spacer { flex: 1; }
.search { border: 1px solid var(--border); background: var(--page); color: var(--ink); border-radius: 8px; padding: 6px 10px; min-height: 32px; min-width: 240px; font: inherit; }
.check { display: inline-flex; gap: 6px; align-items: center; color: var(--ink-2); cursor: pointer; }
.table-wrap { overflow-x: auto; margin: 0 -16px -16px; border-top: 1px solid var(--border); border-radius: 0 0 12px 12px; }
table.t { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.t th, .t td { padding: 9px 12px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--grid); }
.t th:first-child, .t td:first-child { text-align: left; padding-left: 16px; }
.t th.left, .t td.left { text-align: left; }
.t th { font-weight: 600; color: var(--ink-2); font-size: 12.5px; position: sticky; top: 0; background: var(--surface); }
.t th button { border: 0; background: transparent; cursor: pointer; font-weight: 600; color: inherit; padding: 0; display: inline-flex; gap: 4px; align-items: center; }
.t th button:hover { color: var(--ink); }
.t tbody tr.row { cursor: pointer; }
.t tbody tr.row:hover { background: var(--wash); }
.t tr.group-row td { text-align: left; background: var(--page); color: var(--ink-2); font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; padding-top: 7px; padding-bottom: 7px; }
.t tr.dim td { color: var(--muted); }
.t tfoot td { font-weight: 650; border-bottom: 0; background: var(--page); }
.t .name { font-weight: 650; }
.t .name small { display: block; font-weight: 400; color: var(--muted); font-size: 11.5px; }
.chips { display: inline-flex; gap: 4px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px; font-size: 12px; color: var(--ink-2); }
.badge { display: inline-block; border: 1px solid var(--border); border-radius: 6px; padding: 0 6px; font-size: 11.5px; color: var(--ink-2); background: var(--wash); font-weight: 500; margin-left: 6px; }
.empty { padding: 24px; text-align: center; color: var(--muted); }

/* ---------- status icon ---------- */
.st { display: inline-flex; align-items: center; gap: 5px; }
.st svg { flex: none; }

/* ---------- top posts ---------- */
.posts { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.post { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px; border-radius: 10px; }
.post:hover { background: var(--wash); }
.thumb { width: 56px; height: 56px; border-radius: 8px; background: var(--wash); object-fit: cover; display: grid; place-items: center; color: var(--muted); font-size: 11px; overflow: hidden; }
.post-body { min-width: 0; }
.post-text { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
.post-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
.post-stats { display: flex; gap: 14px; font-variant-numeric: tabular-nums; text-align: right; }
.post-stats div { min-width: 52px; }
.post-stats b { display: block; font-size: 14px; }
.post-stats span { color: var(--muted); font-size: 11.5px; }
.post-link { color: var(--ink-2); font-size: 12px; margin-left: 8px; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 40; }
.scrim[hidden], .drawer[hidden] { display: none; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(780px, 100vw); background: var(--page); z-index: 50; overflow-y: auto; border-left: 1px solid var(--border); box-shadow: -12px 0 40px rgba(0, 0, 0, .18); padding: 16px; animation: slide .18s ease-out; }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.drawer-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
.drawer-head h2 { font-size: 20px; font-weight: 650; }
.drawer > * + * { margin-top: 12px; }
.acc-list { display: grid; gap: 8px; }
.acc { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--wash); object-fit: cover; display: grid; place-items: center; font-weight: 650; color: var(--ink-2); overflow: hidden; }
.acc-name { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acc-name a { text-decoration: none; }
.acc-name a:hover { text-decoration: underline; }
.acc-sub { color: var(--ink-2); font-size: 12.5px; }
.acc-fol { text-align: right; font-variant-numeric: tabular-nums; }
.acc-fol b { font-size: 16px; display: block; }
.mini { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
.mini .tile-value { font-size: 20px; }
.note { color: var(--muted); font-size: 12px; }

.loading-card { text-align: center; padding: 48px 16px; color: var(--ink-2); }
.bar-progress { height: 4px; border-radius: 2px; background: var(--track); max-width: 320px; margin: 12px auto 0; overflow: hidden; }
.bar-progress i { display: block; height: 100%; background: var(--series-1); transition: width .3s; }

table.data { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; max-height: 260px; display: block; overflow: auto; }
table.data th, table.data td { padding: 5px 10px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
table.data th:first-child, table.data td:first-child { text-align: left; }
table.data th { color: var(--ink-2); font-weight: 600; position: sticky; top: 0; background: var(--surface); }

@media (max-width: 1100px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kpis .hero { grid-column: 1 / -1; }
  .kpis > :last-child { grid-column: span 2; }
}
@media (max-width: 860px) {
  .grid-2, .grid-2.even { grid-template-columns: minmax(0, 1fr); }
  .post { grid-template-columns: 56px minmax(0, 1fr); }
  .post-stats { grid-column: 1 / -1; justify-content: flex-start; text-align: left; }
}
@media (max-width: 560px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .alert-list { grid-template-columns: minmax(0, 1fr); }
  .search { min-width: 0; flex: 1; }
  .acc { grid-template-columns: 40px minmax(0, 1fr); }
  .acc-fol { grid-column: 2; text-align: left; }
}
@media (prefers-reduced-motion: reduce) {
  .drawer { animation: none; }
  #content, .hb-bar, .bar-progress i { transition: none; }
}
@media (forced-colors: active) {
  .bar, .hb-bar { forced-color-adjust: none; background-image: repeating-linear-gradient(45deg, transparent 0 4px, rgba(0, 0, 0, .35) 4px 6px); }
}

/* ---------- tab, đánh giá tuần, top video ---------- */
.tabs { display: flex; gap: 4px; padding-top: 14px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.tab { border: 0; background: transparent; padding: 8px 14px; cursor: pointer; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--ink); font-weight: 650; border-bottom-color: var(--series-1); }
.chip.link { text-decoration: none; }
.chip.link:hover { background: var(--wash); color: var(--ink); }

.sel-wrap { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); font-size: 12.5px; }
.sel { border: 1px solid var(--border); background: var(--page); color: var(--ink); border-radius: 8px; padding: 5px 8px; min-height: 32px; font: inherit; }

.grade { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 650; border: 1px solid var(--border); white-space: nowrap; }
.grade::before { content: ""; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--muted); }
.grade.good::before { background: var(--good); }
.grade.warning::before { background: var(--warning); }
.grade.critical::before { background: var(--critical); }

.wk-summary { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); margin-top: 12px; }
.wk-summary .tile-value { font-size: 22px; }
.wk-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); margin-top: 12px; }
.wk { display: grid; gap: 10px; align-content: start; }
.wk-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.wk-metrics { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.wk-metrics > div { display: grid; gap: 1px; min-width: 0; }
.m-label { color: var(--muted); font-size: 11.5px; }
.wk-metrics b { font-size: 15px; font-variant-numeric: tabular-nums; }
.m-note { color: var(--ink-2); font-size: 11.5px; }
.insights { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px; }
.wk-posts summary { cursor: pointer; color: var(--ink-2); font-size: 12.5px; }
.wk-posts .posts { margin-top: 6px; }

.vt .vid { display: flex; gap: 10px; align-items: center; white-space: normal; min-width: 320px; max-width: 460px; }
.vid-text { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
.thumb.sm { width: 44px; height: 44px; flex: none; }
.dim { color: var(--muted); }
@media (max-width: 560px) {
  .wk-grid { grid-template-columns: minmax(0, 1fr); }
  .wk-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

.filters[hidden], .tabs[hidden] { display: none; }

.vid-body { display: grid; min-width: 0; }
.vid-body .post-link { margin-left: 0; }

.commentary { border-left: 3px solid var(--series-1); padding: 2px 0 2px 10px; font-size: 13px; }
.commentary p { margin: 2px 0 0; color: var(--ink-2); }

</style>
<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <h1>Dashboard kênh social</h1>
      <p id="sub" class="sub">Nguồn dữ liệu: Zernio</p>
    </div>
    <div class="top-actions">
      <span id="updated" class="updated" aria-live="polite"></span>
      <button id="btn-refresh" class="btn" type="button">Làm mới</button>
      <button id="btn-theme" class="btn btn-icon" type="button" aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện sáng/tối"></button>
    </div>
  </div>
</header>

<main class="wrap" id="app">
  <nav class="tabs" id="tabs" role="tablist" aria-label="Chế độ xem"></nav>
  <div class="filters" id="range-filter" role="group" aria-label="Khoảng thời gian">
    <span class="filters-label">Khoảng thời gian</span>
    <div class="seg" id="range"></div>
  </div>
  <div id="banner" role="status"></div>
  <div id="content"></div>
</main>

<div id="tip" class="tip" role="tooltip" hidden></div>
<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>
<script id="app-src" type="text/plain">
'use strict';
// Bản tĩnh của dashboard: thay các lời gọi /api/... bằng dữ liệu ảnh chụp đã nhúng (window.__SNAPSHOT__).
// Nhờ vậy app.js và insights.js chạy y nguyên như bản local.
(function () {
  const D = window.__SNAPSHOT__;
  if (!D) return;
  window.STATIC_MODE = true;
  window.STATIC_RANGES = Object.keys(D.overviews).map(Number).sort((a, b) => a - b);

  const DAY = 864e5;
  const num = (v) => (Number.isFinite(Number(v)) ? Number(v) : 0);
  const clamp = (v, lo, hi, dflt) => { const n = parseInt(v, 10); return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : dflt; };
  const json = (body, status = 200) => new Response(JSON.stringify(body), { status, headers: { 'Content-Type': 'application/json' } });
  const withMetrics = (p) => {
    const engagement = num(p.likes) + num(p.comments) + num(p.shares) + num(p.saves);
    return { ...p, engagement, er: p.views > 0 ? (engagement / p.views) * 100 : 0 };
  };

  const SORTS = {
    views: (p) => p.views,
    engagement: (p) => p.engagement,
    er: (p) => (p.views >= 100 ? p.er : -1),
    completion: (p) => (p.views >= 100 && p.completion != null ? p.completion : -1),
    completion_rate: (p) => (p.completion != null ? p.completion : -1),
    date: (p) => Date.parse(p.publishedAt) || 0,
  };

  function postsOf(channel) {
    return (D.posts[channel] || []).map((p) => withMetrics({ ...p, channel }));

let pollTimer = 0;
async function load(refresh = false) {
  if (state.loading) return;
  state.loading = true;
  const days = state.days;
  const content = $('content');
  $('btn-refresh').disabled = true;
  const onOverview = state.tab === 'overview'; // tab khác tự vẽ từ snapshot, không bị tải nền làm nhấp nháy
  if (onOverview) $('banner').replaceChildren();
  if (state.data && onOverview) content.classList.add('is-loading');
  else if (onOverview) content.replaceChildren(h('div', { class: 'card loading-card' }, h('p', { id: 'load-text' }, 'Đang tải dữ liệu từ Zernio…'), h('div', { class: 'bar-progress' }, h('i', { id: 'load-bar', style: 'width:0%' }))));
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const st = await (await fetch(`/api/status?days=${days}`)).json();
      const t = $('load-text'), b = $('load-bar');
      if (t && st.loading) { t.textContent = `Đang tải dữ liệu từ Zernio… ${st.done}/${st.total} kênh`; b.style.width = (st.done / st.total) * 100 + '%'; }
    } catch { /* bỏ qua */ }
  }, 500);
  try {
    const res = await fetch(`/api/overview?days=${days}${refresh ? '&refresh=1' : ''}`);
    const j = await res.json();
    if (!res.ok) throw new Error(j.error || res.statusText);
    if (days !== state.days) return;
    state.data = j;
    render();
  } catch (err) {
    if (state.tab === 'overview') {
      $('banner').replaceChildren(h('div', { class: 'banner' }, icon('error', 16), `Không tải được dữ liệu: ${err.message}`, h('button', { class: 'btn', type: 'button', onclick: () => load(true) }, 'Thử lại')));
      if (!state.data) $('content').replaceChildren();
    }
  } finally {
    clearInterval(pollTimer);
    state.loading = false;
    content.classList.remove('is-loading');
    $('btn-refresh').disabled = false;
    if (days !== state.days) load();
  }
}

// ---------- giao diện sáng/tối ----------
function effectiveTheme() {
  return document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}
function paintThemeButton() {
  const dark = effectiveTheme() === 'dark';
  $('btn-theme').replaceChildren(dark
    ? s('svg', { width: 16, height: 16, viewBox: '0 0 16 16', 'aria-hidden': 'true' }, s('circle', { cx: 8, cy: 8, r: 3, fill: 'currentColor' }), s('path', { d: 'M8 1v2M8 13v2M1 8h2M13 8h2M3 3l1.4 1.4M11.6 11.6L13 13M3 13l1.4-1.4M11.6 4.4L13 3', stroke: 'currentColor', 'stroke-width': 1.5, 'stroke-linecap': 'round' }))
    : s('svg', { width: 16, height: 16, viewBox: '0 0 16 16', 'aria-hidden': 'true' }, s('path', { d: 'M13 9.5A5.5 5.5 0 016.5 3 5.5 5.5 0 108 13.5a5.5 5.5 0 005-4z', fill: 'currentColor' })));
}
try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch { /* không có localStorage */ }
$('btn-theme').addEventListener('click', () => {
  const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('theme', next); } catch { /* bỏ qua */ }
  paintThemeButton();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintThemeButton);
paintThemeButton();

$('btn-refresh').addEventListener('click', () => (state.tab === 'overview' ? load(true) : showTab()));
if (STATIC_MODE) $('btn-refresh').hidden = true; // dữ liệu chỉ đổi khi trang được xuất bản lại
else setInterval(() => { if (!document.hidden && !state.loading && state.data && Date.now() - new Date(state.data.generatedAt) > 10 * 60 * 1000) load(); }, 60 * 1000);
renderRange();
load();

'use strict';
// Các màn dựa trên snapshot hằng ngày: Top video, Đánh giá tuần, và các khối bổ sung trong ngăn chi tiết kênh.
// Dùng chung tiện ích (h, fmt, pct, compact, chartCard, lineChart…) và biến `state` của app.js.

// ---------- tab ----------
const TABS = [['overview', 'Tổng quan'], ['videos', 'Top video'], ['weekly', 'Đánh giá tuần']];

function renderTabs() {
  $('tabs').replaceChildren(...TABS.map(([key, label]) => h('button', {
    type: 'button', class: 'tab', role: 'tab', 'aria-selected': String(state.tab === key),
    onclick: () => setTab(key),
  }, label)));
  $('range-filter').hidden = state.tab !== 'overview';
}

function setTab(tab) {
  if (state.tab === tab) return;
  state.tab = tab;
  try { localStorage.setItem('tab', tab); } catch { /* bỏ qua */ }
  renderTabs();
  showTab();
}

function showTab() {
  $('banner').replaceChildren();
  if (state.tab === 'videos') return renderVideosTab();
  if (state.tab === 'weekly') return renderWeeklyTab();
  if (state.data) render();
  else $('content').replaceChildren(h('div', { class: 'card loading-card' }, h('p', null, 'Đang tải dữ liệu từ Zernio…')));
}

async function getJson(url) {
  const res = await fetch(url);
  const j = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(j.error || res.statusText);
  return j;
}

const loadingCard = (text) => h('div', { class: 'card loading-card' }, h('p', null, text));
const emptyCard = (text) => h('div', { class: 'card' }, h('div', { class: 'empty' }, text));

function select(label, options, value, onChange) {
  const el = h('select', { class: 'sel', 'aria-label': label, onchange: (e) => onChange(e.target.value) },
    options.map(([v, text]) => h('option', { value: v }, text)));
  el.value = value;
  return h('label', { class: 'sel-wrap' }, h('span', null, label), el);
}

// ---------- chỉ số giữ chân ----------
const watchText = (p) => {
  const parts = [];
  if (p.completion != null) parts.push(`${dec(p.completion, 1)}% xem hết`);
  if (p.watchSec != null) parts.push(`TB ${dec(p.watchSec, 1)}s`);
  if (p.retention != null) parts.push(`${dec(p.retention, 0)}% độ dài`);
  return parts.join(' · ');
};

// ---------- tab Top video ----------
const vstate = { days: 7, sort: 'engagement', platform: '', channel: '' };

async function renderVideosTab() {
  const content = $('content');
  content.replaceChildren(loadingCard('Đang tải top video…'));
  const q = new URLSearchParams({ days: vstate.days, sort: vstate.sort, limit: 50 });
  if (vstate.platform) q.set('platform', vstate.platform);
  if (vstate.channel) q.set('channel', vstate.channel);
  let j;
  try { j = await getJson(`/api/top-posts?${q}`); } catch (err) {
    if (state.tab === 'videos') content.replaceChildren(emptyCard(err.message));
    return;
  }
  if (state.tab !== 'videos') return;

  const redo = (patch) => { Object.assign(vstate, patch); renderVideosTab(); };
  const filters = h('div', { class: 'toolbar' },
    select('Khoảng thời gian', [[1, '24 giờ'], [3, '3 ngày'], [7, '7 ngày'], [14, '14 ngày'], [30, '30 ngày']], vstate.days, (v) => redo({ days: Number(v) })),
    select('Xếp theo', [['engagement', 'Tương tác'], ['views', 'Lượt xem'], ['er', 'Tỷ lệ tương tác'], ['completion', 'Tỷ lệ xem hết'], ['date', 'Mới nhất']], vstate.sort, (v) => redo({ sort: v })),
    select('Nền tảng', [['', 'Tất cả'], ...j.platforms.map((p) => [p, platformName(p)])], vstate.platform, (v) => redo({ platform: v })),
    select('Kênh', [['', 'Tất cả'], ...j.channels.map((c) => [c, c])], vstate.channel, (v) => redo({ channel: v })));

  const cols = ['Video', 'Kênh', 'Đăng', 'Views', 'Thích', 'BL', 'Chia sẻ', 'Lưu', 'ER', 'Xem hết', 'Xem TB'];
  const rows = j.posts.map((p) => h('tr', null,
    h('td', { class: 'left vid' }, postThumb(p), h('span', { class: 'vid-body' },
      h('span', { class: 'vid-text' }, p.content || '(không có nội dung)'),
      p.url && h('a', { class: 'post-link', href: p.url, target: '_blank', rel: 'noopener noreferrer' }, 'Mở bài ↗'))),
    h('td', { class: 'left' }, p.channel, h('small', { class: 'dim' }, ` ${platformName(p.platform)}`)),
    h('td', null, fmtDate(p.publishedAt)),
    h('td', null, fmt(p.views)), h('td', null, fmt(p.likes)), h('td', null, fmt(p.comments)), h('td', null, fmt(p.shares)), h('td', null, fmt(p.saves)),
    h('td', null, p.views ? pct(p.er) : '—'),
    h('td', null, p.completion != null ? dec(p.completion, 1) + '%' : '—'),
    h('td', null, p.watchSec != null ? dec(p.watchSec, 1) + 's' : '—')));

  content.replaceChildren(h('section', { class: 'card' },
    h('div', { class: 'card-head' },
      h('div', null, h('h2', { class: 'card-title' }, 'Top video'),
        h('p', { class: 'card-sub' }, `${fmt(j.total)} bài khớp bộ lọc, hiển thị ${j.posts.length} · snapshot ${fmtTime(j.generatedAt)}. Xếp theo tỷ lệ chỉ tính bài từ 100 views trở lên.`)),
      filters),
    j.posts.length
      ? h('div', { class: 'table-wrap' }, h('table', { class: 't vt' }, h('thead', null, h('tr', null, cols.map((c, i) => h('th', { class: i < 2 ? 'left' : '' }, c)))), h('tbody', null, rows)))
      : h('div', { class: 'empty' }, 'Không có bài nào khớp bộ lọc'),
    h('p', { class: 'note', style: 'margin-top:12px' }, 'ER = (thích + bình luận + chia sẻ + lưu) / views. Tỷ lệ xem hết và thời gian xem trung bình chỉ có ở nền tảng Zernio cung cấp (hiện chủ yếu TikTok); Facebook chỉ có thời gian xem trung bình.')));
}

function postThumb(p) {
  const label = p.mediaType === 'video' ? 'video' : 'ảnh';
  return p.thumb
    ? h('img', { class: 'thumb sm', src: p.thumb, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer', onerror: (e) => e.target.replaceWith(h('div', { class: 'thumb sm' }, label)) })
    : h('div', { class: 'thumb sm' }, label);
}

// ---------- tab Đánh giá tuần ----------
const GRADE = {
  surge: { label: 'Tăng tốc', tone: 'good', rank: 0 },
  growing: { label: 'Tăng trưởng tốt', tone: 'good', rank: 1 },
  steady: { label: 'Ổn định', tone: 'muted', rank: 2 },
  slowing: { label: 'Chững lại', tone: 'warning', rank: 3 },
  declining: { label: 'Giảm', tone: 'critical', rank: 4 },
  inactive: { label: 'Không đăng bài', tone: 'critical', rank: 5 },
  nodata: { label: 'Thiếu dữ liệu', tone: 'muted', rank: 6 },
};
const gradeBadge = (g) => h('span', { class: `grade ${(GRADE[g] || GRADE.nodata).tone}` }, (GRADE[g] || GRADE.nodata).label);
const signed = (n) => (n > 0 ? '+' : n < 0 ? '−' : '') + fmt(Math.abs(n));
const wstate = { week: '', group: '', sort: 'grade' };

async function renderWeeklyTab() {
  const content = $('content');
  content.replaceChildren(loadingCard('Đang tải báo cáo tuần…'));
  let w;
  try { w = await getJson(`/api/weekly${wstate.week ? `?week=${wstate.week}` : ''}`); } catch (err) {
    if (state.tab === 'weekly') content.replaceChildren(emptyCard(err.message));
    return;
  }
  if (state.tab !== 'weekly') return;

  const groups = [...new Set(w.channels.map((c) => c.group))];
  let rows = w.channels.filter((c) => !wstate.group || c.group === wstate.group);
  const by = {
    grade: (a, b) => (GRADE[a.grade]?.rank ?? 9) - (GRADE[b.grade]?.rank ?? 9) || (b.week?.views || 0) - (a.week?.views || 0),
    views: (a, b) => (b.week?.views || 0) - (a.week?.views || 0),
    growth: (a, b) => (b.viewsChange ?? -1e9) - (a.viewsChange ?? -1e9),
    followers: (a, b) => (b.followerGain || 0) - (a.followerGain || 0),
    er: (a, b) => (b.week?.er || 0) - (a.week?.er || 0),
  };
  rows = [...rows].sort(by[wstate.sort]);
  const redo = (patch) => { Object.assign(wstate, patch); renderWeeklyTab(); };

  const counts = {};
  for (const c of w.channels) counts[c.grade] = (counts[c.grade] || 0) + 1;
  const summary = h('div', { class: 'wk-summary' }, Object.entries(GRADE).filter(([k]) => counts[k]).map(([k, g]) =>
    h('div', { class: 'card tile' }, h('p', { class: 'tile-label' }, g.label), h('p', { class: 'tile-value' }, String(counts[k])))));

  const toolbar = h('div', { class: 'toolbar' },
    select('Tuần', (w.weeks.length ? w.weeks : [w.week]).map((k) => [k, k]), w.week, (v) => redo({ week: v })),
    select('Nhóm', [['', 'Tất cả'], ...groups.map((g) => [g, g])], wstate.group, (v) => redo({ group: v })),
    select('Xếp theo', [['grade', 'Đánh giá'], ['views', 'Views'], ['growth', '% views so với tuần trước'], ['followers', 'Follower tăng'], ['er', 'Tỷ lệ tương tác']], wstate.sort, (v) => redo({ sort: v })));

  content.replaceChildren(
    h('section', { class: 'card' },
      h('div', { class: 'card-head' },
        h('div', null, h('h2', { class: 'card-title' }, `Đánh giá tuần ${w.week}`),
          h('p', { class: 'card-sub' }, `${w.from} → ${w.to} · so với 7 ngày liền trước · ER trung vị hệ thống ${w.systemMedianEr != null ? pct(w.systemMedianEr) : '—'}`)),
        toolbar),
      h('p', { class: 'note' }, 'Điểm dựa trên: thay đổi views, follower ròng, tỷ lệ tương tác so với trung vị hệ thống. Nhận xét nội dung là phân tích số liệu từng bài (bài nổi bật, bài kém, tần suất, tỷ lệ xem hết), chưa đọc nội dung video.')),
    summary,
    h('div', { class: 'wk-grid' }, rows.map(weeklyCard)));
}

function weeklyCard(c) {
  if (!c.week) return h('section', { class: 'card wk' }, h('div', { class: 'wk-head' }, h('h3', { class: 'card-title' }, c.label || c.name), gradeBadge(c.grade)), h('p', { class: 'note' }, (c.insights || []).join(' ')));
  const w = c.week, p = c.prev;
  const metric = (label, value, note) => h('div', null, h('span', { class: 'm-label' }, label), h('b', null, value), note && h('span', { class: 'm-note' }, note));
  return h('section', { class: 'card wk' },
    h('div', { class: 'wk-head' }, h('div', null, h('h3', { class: 'card-title' }, c.label || c.name), h('p', { class: 'card-sub' }, c.group)), gradeBadge(c.grade)),
    h('div', { class: 'wk-metrics' },
      metric('Follower', fmt(c.followers), `${signed(c.followerGain)}${c.followerGainPct != null ? ` (${c.followerGainPct >= 0 ? '+' : '−'}${dec(Math.abs(c.followerGainPct), 1)}%)` : ''}`),
      metric('Views', compact(w.views), c.viewsChange != null ? delta(w.views, p.views) : `trước ${compact(p.views)}`),
      metric('Tương tác', w.views ? pct(w.er) : '—', p.views ? `trước ${pct(p.er)}` : null),
      metric('Bài đăng', fmt(w.posts), `trước ${fmt(p.posts)}`),
      metric('Xem hết', w.completion != null ? dec(w.completion, 1) + '%' : '—', w.watchSec != null ? `TB ${dec(w.watchSec, 1)}s` : null)),
    h('ul', { class: 'insights' }, c.insights.map((t) => h('li', null, t))),
    commentaryBlock(c),
    c.platforms?.length ? h('p', { class: 'note' }, c.platforms.map((x) => `${platformName(x.platform)}: ${x.posts} bài, ${compact(x.views)} views, ER ${x.views ? pct(x.er) : '—'}`).join(' · ')) : null,
    c.topPosts?.length ? h('details', { class: 'wk-posts' }, h('summary', null, `Top ${c.topPosts.length} bài trong tuần`),
      h('ul', { class: 'posts' }, c.topPosts.map((tp) => weeklyPost(tp)))) : null);
}

// Nhận xét nội dung do Claude viết hằng tuần (nếu đã có cho tuần này).
function commentaryBlock(c) {
  return c.commentary
    ? h('div', { class: 'commentary' }, h('b', null, c.commentaryWeek ? `Nhận xét nội dung (tuần ${c.commentaryWeek})` : 'Nhận xét nội dung'), h('p', null, c.commentary))
    : null;
}

function weeklyPost(p) {
  return h('li', { class: 'post' }, postThumb(p),
    h('div', { class: 'post-body' }, h('p', { class: 'post-text' }, p.content || '(không có nội dung)'),
      h('p', { class: 'post-meta' }, [platformName(p.platform), fmtDate(p.publishedAt), watchText(p)].filter(Boolean).join(' · '),
        p.url && h('a', { class: 'post-link', href: p.url, target: '_blank', rel: 'noopener noreferrer' }, 'Mở bài ↗'))),
    h('div', { class: 'post-stats' },
      h('div', null, h('b', null, compact(p.views)), h('span', null, 'views')),
      h('div', null, h('b', null, compact(p.likes)), h('span', null, 'thích')),
      h('div', null, h('b', null, p.views ? pct(p.er) : '—'), h('span', null, 'ER'))));
}

// ---------- bổ sung cho ngăn chi tiết kênh ----------

// Số follower theo ngày dựng ngược từ mức tăng ròng mỗi ngày của Zernio (chính xác với số hiện tại, ước tính cho quá khứ).
function followerSeriesCard(c) {
  const daily = c.daily || [];
  if (daily.length < 2) return null;
  const rows = new Array(daily.length);
  let cur = c.followers.current;
  for (let i = daily.length - 1; i >= 0; i--) {
    rows[i] = { date: daily[i].date, followers: Math.max(0, cur), gained: daily[i].followersGained };
    cur -= daily[i].followersGained;
  }
  return chartCard({
    title: 'Tổng follower theo ngày', sub: 'Dựng ngược từ số hiện tại và mức tăng/giảm ròng mỗi ngày',
    rows, columns: [{ label: 'Ngày', get: (r) => fmtDay(r.date) + '/' + r.date.slice(0, 4) }, { label: 'Follower', get: (r) => fmt(r.followers) }, { label: 'Thay đổi', get: (r) => signed(r.gained) }],
    draw: (host) => lineChart(host, rows, { key: 'followers', label: 'follower', title: 'Tổng follower theo ngày' }),
  });
}

// Đánh giá tuần của kênh, nạp bất đồng bộ từ báo cáo mới nhất.
function weeklyDrawerCard(name) {
  const box = h('section', { class: 'card' }, h('div', { class: 'card-head' }, h('h3', { class: 'card-title' }, 'Đánh giá tuần')), h('div', { class: 'empty' }, 'Đang tải…'));
  getJson('/api/weekly').then((w) => {
    const c = w.channels.find((x) => x.name === name);
    box.replaceChildren(
      h('div', { class: 'card-head' }, h('div', null, h('h3', { class: 'card-title' }, `Đánh giá tuần ${w.week}`), h('p', { class: 'card-sub' }, `${w.from} → ${w.to}`)), c ? gradeBadge(c.grade) : null),
      c ? h('ul', { class: 'insights' }, c.insights.map((t) => h('li', null, t)))
        : h('p', { class: 'note' }, 'Kênh này không có trong báo cáo tuần (có thể trùng tài khoản với kênh khác).'),
      c ? commentaryBlock(c) : null);
  }).catch((err) => box.replaceChildren(h('div', { class: 'card-head' }, h('h3', { class: 'card-title' }, 'Đánh giá tuần')), h('p', { class: 'note' }, err.message)));
  return box;
}

// ---------- khởi động ----------
try { const t = localStorage.getItem('tab'); if (TABS.some(([k]) => k === t)) state.tab = t; } catch { /* không có localStorage */ }
renderTabs();
if (state.tab !== 'overview') showTab();
