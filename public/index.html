<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard kênh social</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Cpath d='M7 22l6-7 5 4 7-10' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap top-in">
    <div class="brand">
      <h1>Dashboard kênh social</h1>
      <p id="sub" class="sub">Nguồn dữ liệu: Zernio</p>
    </div>
    <div class="top-actions">
      <span id="updated" class="updated" aria-live="polite"></span>
      <button id="btn-refresh" class="btn" type="button">Làm mới</button>
      <button id="btn-theme" class="btn btn-icon" type="button" aria-label="Đổi giao diện sáng/tối" title="Đổi giao diện sáng/tối"></button>
    </div>
  </div>
</header>

<main class="wrap" id="app">
  <nav class="tabs" id="tabs" role="tablist" aria-label="Chế độ xem"></nav>
  <div class="filters" id="range-filter" role="group" aria-label="Khoảng thời gian">
    <span class="filters-label">Khoảng thời gian</span>
    <div class="seg" id="range"></div>
  </div>
  <div id="banner" role="status"></div>
  <div id="content"></div>
</main>

<div id="tip" class="tip" role="tooltip" hidden></div>
<div id="scrim" class="scrim" hidden></div>
<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden></aside>

<script src="app.js"></script>
<script src="insights.js"></script>
</body>
</html>
